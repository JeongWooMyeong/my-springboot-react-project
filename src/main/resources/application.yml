server-host: 192.168.1.102

spring:
  application:
    name: SpringBootProject

  data:
    redis:
      host: ${server-host}
      port: 6379

  cache:
    type: redis

  datasource:
    primary:
      jdbcUrl: jdbc:sqlserver://${server-host}:1433;databaseName=pms02_jwm;encrypt=false;trustServerCertificate=true
      username: pms01
      password: pms01
      driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

    oracle:
      jdbcUrl: jdbc:oracle:thin:@//${server-host}:1521/XEPDB1
      username: ERP
      password: erp1234
      driver-class-name: oracle.jdbc.OracleDriver

  elasticsearch:
    uris: http://${server-host}:9200

  kafka:
    bootstrap-servers: ${server-host}:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: approval-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

  rabbitmq:
    host: ${server-host}
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        acknowledge-mode: auto
        concurrency: 3
        max-concurrency: 10
        prefetch: 1
    publisher-confirm-type: correlated
    publisher-returns: true

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

server:
  port: 8081

mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    org.mybatis: DEBUG
    org.mybatis.spring: DEBUG
    com.example.springbootproject.pms.sy.sm.service.dao: DEBUG
    com.example.springbootproject.pms.sy.sm.service.impl: DEBUG
    org.springframework.jdbc.core: DEBUG
    org.springframework.jdbc.core.StatementCreatorUtils: TRACE
    org.springframework.data.elasticsearch: DEBUG
    co.elastic.clients: DEBUG

font:
  upload:
    path: C:/Project/SpringBootProject/upload/fonts/

project:
  root:
    path: C:/Project/SpringBootProject

storage:
  type: minio
  endpoint: ${MINIO_ENDPOINT:http://${server-host}:9000}
  access-key: ${MINIO_ACCESS_KEY:admin}
  secret-key: ${MINIO_SECRET_KEY:admin12345}
  bucket: ${MINIO_BUCKET:springbootproject}