spring.application.name=SpringBootProject


spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=pms02_jwm;encrypt=false;trustServerCertificate=true
spring.datasource.username=pms01
spring.datasource.password=pms01
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver


#Mybatis ??
mybatis.mapper-locations=classpath:mapper/*/*.xml
mybatis.type-aliases-package= com.example.springbootproject.pms

server.port = 8081

spring.kafka.bootstrap-servers=localhost:9092

# Kafka ??
# Producer ??
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Consumer ??
spring.kafka.consumer.group-id=approval-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=*

spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# MyBatis SQL ??? DEBUG ??? ??
logging.level.org.mybatis=DEBUG
logging.level.org.mybatis.spring=DEBUG
logging.level.com.example.springbootproject.pms.sy.sm.service.dao=DEBUG
logging.level.com.example.springbootproject.pms.sy.sm.service.impl=DEBUG
# MyBatis SQL ?? ??
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl


# JDBC ?? ???? ?? ???
logging.level.org.springframework.jdbc.core=DEBUG
logging.level.org.springframework.jdbc.core.StatementCreatorUtils=TRACE

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB


font.upload.path=C:/Project/SpringBootProject/upload/fonts/