plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'SpringBootProject'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    //implementation 'org.springframework.boot:spring-boot-starter-security'
    //implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    //mybatis
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.3'
    // SQL Server JDBC Driver
    //runtimeOnly 'com.microsoft.sqlserver:mssql-jdbc:12.8.1.jre17'

    //implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    annotationProcessor 'org.projectlombok:lombok'
    runtimeOnly 'com.microsoft.sqlserver:mssql-jdbc'
    // JWT 관련 라이브러리
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // 혹시 빠져 있다면 명시적으로 추가
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.0'

    // iText7 PDF 라이브러리 (최신 안정 버전)
    implementation 'com.itextpdf:itext7-core:9.7.0'


    //testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    //testImplementation 'org.springframework.boot:spring-boot-starter-data-jdbc-test'
    //testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    //testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    //runtimeOnly 'com.microsoft.sqlserver:mssql-jdbc'
    //testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.register('buildFrontend', Exec) {
    onlyIf { project.hasProperty('frontend') }  // ✅ frontend flag 있을 때만 실행
    workingDir "$projectDir/frontend"
    if (org.gradle.internal.os.OperatingSystem.current().isWindows()) {
        commandLine "C:/Program Files/nodejs/npm.cmd", "run", "build"
    } else {
        commandLine "npm", "run", "build"
    }

}

tasks.register('copyFrontend', Copy) {
    onlyIf { project.hasProperty('frontend') }  // ✅ frontend flag 있을 때만 실행
    from("$projectDir/frontend/dist")
    into("$projectDir/src/main/resources/static")
}

copyFrontend.dependsOn buildFrontend
processResources.dependsOn copyFrontend


