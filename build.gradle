plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'SpringBootProject'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {

    // =========================
    // Spring
    // =========================

    implementation 'org.springframework.boot:spring-boot-starter-web'

    implementation 'org.springframework.boot:spring-boot-starter-security'

    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    implementation 'org.springframework.boot:spring-boot-starter-jdbc'

    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    implementation 'org.springframework.boot:spring-boot-starter-cache'

    implementation 'org.springframework.boot:spring-boot-starter-amqp'

    implementation 'org.springframework.boot:spring-boot-starter-data-elasticsearch'


    // =========================
    // Kafka
    // =========================

    implementation 'org.springframework.boot:spring-boot-starter-kafka'


    // =========================
    // MyBatis
    // =========================

    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:4.0.0'


    // =========================
    // Database
    // =========================

    runtimeOnly 'com.microsoft.sqlserver:mssql-jdbc'

    implementation 'com.oracle.database.jdbc:ojdbc8:23.2.0.0'


    // =========================
    // JWT
    // =========================

    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'


    // =========================
    // PDF
    // =========================

    implementation 'com.itextpdf:itext7-core:9.7.0'


    // =========================
    // MinIO
    // =========================

    implementation 'io.minio:minio:9.0.3'


    // =========================
    // Lombok
    // =========================

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'


    // =========================
    // DevTools
    // =========================

    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // =========================
    // Test
    // =========================

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-kafka-test'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    implementation 'org.springframework.boot:spring-boot-jackson2'
}

tasks.named('test') {
    useJUnitPlatform()
}


// =========================
// Frontend
// =========================

tasks.register('buildFrontend', Exec) {

    onlyIf {
        project.hasProperty('frontend')
    }

    workingDir "$projectDir/frontend"

    if (org.gradle.internal.os.OperatingSystem.current().isWindows()) {
        commandLine "C:/Program Files/nodejs/npm.cmd", "run", "build"
    } else {
        commandLine "npm", "run", "build"
    }
}


tasks.register('copyFrontend', Copy) {

    onlyIf {
        project.hasProperty('frontend')
    }

    from("$projectDir/frontend/dist")
    into("$projectDir/src/main/resources/static")
}


copyFrontend.dependsOn buildFrontend
processResources.dependsOn copyFrontend