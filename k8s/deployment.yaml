apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp-deployment
spec:
  replicas: 1   # Pod 개수 (확장성)
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
      - name: myapp
        image: jeongwoomyeong/myapp:1   # 로컬 레지스트리 이미지 사용
        imagePullPolicy: Always      # 레지스트리 기반에서는 Never 대신 IfNotPresent 권장
        ports:
          - containerPort: 8081
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1"